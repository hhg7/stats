name             = Stats-LikeR
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2026-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = MakeMaker
-remove = GatherDir

[Git::GatherDir]
exclude_filename = Makefile.PL

[PruneFiles]
match = ^(?!lib/|t/|pod/|LikeR\.xs$|ppport\.h$|README(\.md)?$|CONTRIBUTING\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[PodWeaver]

[MakeMaker::Awesome]
eumm_version = 6.48
header = use Config;
header = use File::Temp ();
header = use File::Spec ();
header = # LikeR.xs needs C99: // comments, declarations inside blocks and for(),
header = # <stdint.h>, and `restrict` where the compiler has a spelling for it.
header = # The flag that asks for C99 is per-vendor, and it cannot be guessed from
header = # $Config{cc}: that is plain "cc" for Oracle Studio on Solaris and for aCC
header = # on HP-UX, both of which used to match this file's old /\b(?:g?cc|clang)\b/
header = # test, get handed -std=gnu99, and fail the build on an illegal option.
header = # So each candidate is trial-compiled and the first one that actually works
header = # wins: -std=gnu99/-std=c99 for gcc and clang (all BSDs included),
header = # -xc99=all for Studio, -qlanglvl=extc99 for AIX xlc, -AC99 for HP-UX, and
header = # finally '' for a compiler whose default mode is already C99. MSVC is
header = # skipped outright -- it needs no flag for any of the above and merely warns
header = # on switches it does not know, which would make the probe pick a no-op.
header = my $std = '';
header = unless ($Config{cc} =~ /(?:^|[\/\\])cl(?:\.exe)?$/i) {
header =     my $c99 = "#include <stdint.h>\n"
header =             . "int main(void) { uint64_t u = 0; // C99 comment\n"
header =             . "for (int i = 0; i < 3; i++) { u += (uint64_t)i; }\n"
header =             . "return (int)(u - 3); }\n";
header =     my $dir = File::Temp::tempdir(CLEANUP => 1);
header =     my $src = File::Spec->catfile($dir, 'c99probe.c');
header =     my $obj = File::Spec->catfile($dir, 'c99probe.o');
header =     if (open my $probe_fh, '>', $src) {
header =         print {$probe_fh} $c99;
header =         close $probe_fh;
header =         my $quiet = File::Spec->devnull;
header =         for my $flag ('-std=gnu99', '-std=c99', '-xc99=all', '-qlanglvl=extc99', '-AC99', '') {
header =             next if system("$Config{cc} $flag -c $src -o $obj > $quiet 2> $quiet") != 0;
header =             $std = $flag eq '' ? '' : " $flag";
header =             last;
header =         }
header =     }
header = }
header = # On a long-double perl, LikeR.xs wants the `l` suffixed libm functions so that
header = # an NV is not silently computed at double precision. They are C99, but some
header = # libms (the thinner BSD ones especially) do not ship the whole set, so the set
header = # is link-tested as a unit: all of it, or the module falls back to the double
header = # functions exactly as it did before. __float128 needs no probe -- quadmath.h
header = # and -lquadmath come with the quadmath perl itself.
header = my $define = '';
header = if ($Config{nvtype} eq 'long double') {
header =     my $ld = "#include <math.h>\n"
header =            . "int main(void) { int e; long double x = 1.0L;\n"
header =            . "  volatile long double r = lgammal(x) + sqrtl(x) + logl(x) + log1pl(x)\n"
header =            . "    + log2l(x) + log10l(x) + expl(x) + powl(x, x) + floorl(x) + ceill(x) + roundl(x)\n"
header =            . "    + rintl(x) + truncl(x) + fmaxl(x, x) + erfcl(x) + asinl(x) + sinhl(x) + coshl(x)\n"
header =            . "    + tanhl(x) + fabsl(x) + ldexpl(x, 2) + frexpl(x, &e)\n"
header =            . "    + acosl(x) + cosl(x) + sinl(x);\n"
header =            . "  return (int)r * 0; }\n";
header =     my $dir = File::Temp::tempdir(CLEANUP => 1);
header =     my $src = File::Spec->catfile($dir, 'ldmath.c');
header =     my $bin = File::Spec->catfile($dir, 'ldmath');
header =     if (open my $ld_fh, '>', $src) {
header =         print {$ld_fh} $ld;
header =         close $ld_fh;
header =         my $quiet = File::Spec->devnull;
header =         $define = '-DLIKER_HAVE_LONG_DOUBLE_MATH'
header =             if system("$Config{cc}$std -o $bin $src -lm > $quiet 2> $quiet") == 0;
header =     }
header =     warn "Stats::LikeR: this libm is missing some long double math functions;\n"
header =        . "  falling back to double precision internals.\n" unless $define;
header = }
WriteMakefile_arg = CCFLAGS => $Config::Config{ccflags} . $std
WriteMakefile_arg = DEFINE => $define
WriteMakefile_arg = LIBS => ['-lm']
; EUMM scans for *.PL files to run during the build, and dev.Makefile.PL -- the
; maintainer's local convenience wrapper -- looks like one.  It was being run in
; the middle of `make` as `perl dev.Makefile.PL dev.Makefile`, and since it calls
; WriteMakefile() it overwrote the real Makefile with its own: no DEFINE, no
; probed C99 flag, and a different VERSION, which is what made the .so come out
; stamped 0.28 and forced `make` to be run twice.  Nothing here is generated by a
; .PL file, so the scan is turned off entirely.
WriteMakefile_arg = PL_FILES => {}

[VersionFromModule]
[MetaJSON]

; the 'provides' map in META.yml/META.json: which module each package lives in,
; and at what version.  CPANTS looks for it (meta_yml_has_provides), and PAUSE
; indexes from it rather than guessing by scanning the tarball.
[MetaProvides::Package]
meta_noindex = 1

; Stats::LikeR::col is the object col() hands to filter(); it lives inside
; LikeR.pm, is not documented as a class and cannot be require'd by its own
; name, so it is kept out of the index -- and, because MetaProvides::Package is
; told to respect no_index above, out of 'provides' with it.
[MetaNoIndex]
package = Stats::LikeR::col

[Prereqs]
perl                = 5.010
autodie             = 0
Cwd                 = 0
Scalar::Util        = 1.22
Test::Exception     = 0
Test::LeakTrace     = 0
Test::More          = 0

[MetaResources]
repository.web = https://github.com/hhg7/stats
repository.url = https://github.com/hhg7/stats.git
repository.type = git
bugtracker.web = https://github.com/hhg7/stats/issues
homepage = https://metacpan.org/dist/stats
